services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_shop
      POSTGRES_PASSWORD: ticket_shop_dev
      POSTGRES_DB: ticket_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_shop -d ticket_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
